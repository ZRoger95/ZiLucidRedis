name: Fuzz

on:
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch:
    inputs:
      seed:
        description: '重放 seed（留空则每次随机）'
        required: false
        type: string
      multiplier:
        description: '轮数放大倍数（留空默认 20）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fuzz
        env:
          FUZZ_SEED: ${{ inputs.seed }}
          FUZZ_MULTIPLIER: ${{ inputs.multiplier }}
      - name: 报告写入 Step Summary
        if: always()
        run: cat .fuzz/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: fuzz-report
          include-hidden-files: true
          path: .fuzz/